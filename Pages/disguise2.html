<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lumen Study · Flashcards</title>
    <link rel="icon" href="../lumen.png" type="image/png">
    <meta name=" description" content="Free flashcards and quizzes for students.">
    <style>
        :root {
            --bg: #f5f6fa;
            --card: #fff;
            --ink: #1f2430;
            --muted: #6b7280;
            --line: #e3e6ee;
            --brand: #3b5bdb;
            --brand-2: #eef1ff;
            --ok: #2f9e66;
            --bad: #d6455d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
            border: 0;
            background: none
        }

        button:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px
        }

        .top {
            height: 56px;
            flex: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 22px;
            background: var(--card);
            border-bottom: 1px solid var(--line)
        }

        .logo {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center
        }

        .logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 8px
        }

        .top b {
            font-size: 1.05rem;
            letter-spacing: -.01em
        }

        .top span {
            margin-left: auto;
            color: var(--muted);
            font-size: .85rem
        }

        .layout {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 270px 1fr
        }

        aside {
            overflow-y: auto;
            padding: 20px 14px;
            border-right: 1px solid var(--line);
            background: var(--card)
        }

        aside h2 {
            padding: 0 10px 10px;
            font-size: .72rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .deck {
            display: block;
            width: 100%;
            text-align: left;
            padding: 11px 12px;
            border-radius: 10px;
            margin-bottom: 4px
        }

        .deck:hover {
            background: var(--bg)
        }

        .deck.on {
            background: var(--brand-2);
            color: var(--brand)
        }

        .deck b {
            display: block;
            font-weight: 600;
            font-size: .92rem
        }

        .deck small {
            color: var(--muted);
            font-size: .78rem
        }

        main {
            overflow-y: auto;
            padding: 28px clamp(18px, 5vw, 56px) 40px
        }

        .wrap {
            max-width: 720px;
            margin: 0 auto
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }

        h1 {
            font-size: 1.5rem;
            letter-spacing: -.02em
        }

        .modes {
            display: inline-flex;
            padding: 3px;
            gap: 2px;
            background: #e9ecf4;
            border-radius: 10px
        }

        .modes button {
            padding: 6px 16px;
            border-radius: 8px;
            font-size: .85rem;
            color: var(--muted)
        }

        .modes button.on {
            background: var(--card);
            color: var(--ink);
            box-shadow: 0 1px 3px rgba(20, 30, 60, .12)
        }

        .prog {
            height: 6px;
            margin: 18px 0 8px;
            border-radius: 6px;
            background: #e3e6ee;
            overflow: hidden
        }

        .prog i {
            display: block;
            height: 100%;
            width: 0;
            background: var(--brand);
            border-radius: 6px;
            transition: width .25s
        }

        .count {
            color: var(--muted);
            font-size: .82rem;
            margin-bottom: 18px
        }

        .fc {
            position: relative;
            height: 280px;
            perspective: 1200px;
            cursor: pointer
        }

        .face {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 28px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 6px 22px -12px rgba(30, 40, 80, .25);
            backface-visibility: hidden;
            transition: transform .4s
        }

        .face small {
            font-size: .72rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .face p {
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: -.01em
        }

        .back {
            transform: rotateY(180deg)
        }

        .fc.flip .front {
            transform: rotateY(180deg)
        }

        .fc.flip .back {
            transform: rotateY(360deg)
        }

        .ctl {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--card);
            font-weight: 500;
            font-size: .9rem
        }

        .btn:hover {
            border-color: #c5cbdd
        }

        .btn.ok {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff
        }

        .btn.main {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff
        }

        .q {
            padding: 26px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px;
            margin-bottom: 14px
        }

        .q small {
            font-size: .72rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted)
        }

        .q p {
            margin-top: 6px;
            font-size: 1.6rem;
            font-weight: 600
        }

        .opt {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--card)
        }

        .opt:hover {
            border-color: var(--brand)
        }

        .opt i {
            flex: none;
            width: 24px;
            height: 24px;
            border-radius: 7px;
            background: var(--bg);
            display: grid;
            place-items: center;
            font-style: normal;
            font-size: .78rem;
            color: var(--muted)
        }

        .opt.right {
            border-color: var(--ok);
            background: #eaf8f1
        }

        .opt.wrong {
            border-color: var(--bad);
            background: #fdeef1
        }

        .done {
            text-align: center;
            padding: 48px 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 18px
        }

        .done b {
            display: block;
            font-size: 3rem;
            color: var(--brand)
        }

        .done p {
            color: var(--muted);
            margin-top: 4px
        }

        .keys {
            margin-top: 26px;
            text-align: center;
            font-size: .78rem;
            color: var(--muted)
        }

        @media (max-width:760px) {
            .layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr
            }

            aside {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                overflow-y: hidden;
                padding: 10px;
                border-right: 0;
                border-bottom: 1px solid var(--line)
            }

            aside h2 {
                display: none
            }

            .deck {
                flex: none;
                width: auto;
                margin: 0
            }

            .fc {
                height: 230px
            }
        }
    </style>
</head>

<body>
    <header class="top">
        <div class="logo"><img src="../lumen.png" alt="" width="30" height="30"></div>
        <b>Lumen Study</b>
        <span>Flashcards &amp; quizzes</span>
    </header>

    <div class="layout">
        <aside>
            <h2>Study sets</h2>
            <div id="decks"></div>
        </aside>
        <main>
            <div class="wrap">
                <div class="bar">
                    <h1 id="title"></h1>
                    <div class="modes" id="modes"></div>
                </div>
                <div class="prog"><i id="pbar"></i></div>
                <div class="count" id="count"></div>
                <section id="stage"></section>
                <p class="keys" id="keys"></p>
            </div>
        </main>
    </div>

    <script>
        (() => {
            const $ = s => document.querySelector(s);
            const PASS = atob("c2lsZW5jZQ==");   // the unlock phrase, never part of any card

            const DECKS = [
                {
                    name: "Periodic table", sub: "Chemistry · 20 cards", f: "Symbol", b: "Element", cards: [
                        ["H", "Hydrogen"], ["He", "Helium"], ["Li", "Lithium"], ["Be", "Beryllium"], ["B", "Boron"],
                        ["C", "Carbon"], ["N", "Nitrogen"], ["O", "Oxygen"], ["F", "Fluorine"], ["Ne", "Neon"],
                        ["Na", "Sodium"], ["Mg", "Magnesium"], ["Al", "Aluminum"], ["Si", "Silicon"], ["P", "Phosphorus"],
                        ["S", "Sulfur"], ["Cl", "Chlorine"], ["Ar", "Argon"], ["K", "Potassium"], ["Ca", "Calcium"]]
                },
                {
                    name: "Math formulas", sub: "Algebra & geometry · 12 cards", f: "Name", b: "Formula", cards: [
                        ["Area of a circle", "A = πr²"], ["Circumference of a circle", "C = 2πr"],
                        ["Pythagorean theorem", "a² + b² = c²"], ["Slope formula", "m = (y₂ − y₁) / (x₂ − x₁)"],
                        ["Quadratic formula", "x = (−b ± √(b² − 4ac)) / 2a"], ["Area of a triangle", "A = ½ × base × height"],
                        ["Volume of a cylinder", "V = πr²h"], ["Slope-intercept form", "y = mx + b"],
                        ["Area of a trapezoid", "A = ½(b₁ + b₂)h"], ["Volume of a sphere", "V = (4/3)πr³"],
                        ["Distance formula", "d = √((x₂ − x₁)² + (y₂ − y₁)²)"], ["Angles in a triangle", "Add up to 180°"]]
                },
                {
                    name: "Spanish basics", sub: "Vocabulary · 16 cards", f: "Español", b: "English", cards: [
                        ["hola", "hello"], ["adiós", "goodbye"], ["gracias", "thank you"], ["por favor", "please"],
                        ["buenos días", "good morning"], ["¿cómo estás?", "how are you?"], ["agua", "water"], ["casa", "house"],
                        ["libro", "book"], ["escuela", "school"], ["amigo", "friend"], ["comida", "food"],
                        ["perro", "dog"], ["gato", "cat"], ["rojo", "red"], ["azul", "blue"]]
                },
                {
                    name: "US state capitals", sub: "Geography · 15 cards", f: "State", b: "Capital", cards: [
                        ["Texas", "Austin"], ["California", "Sacramento"], ["New York", "Albany"], ["Florida", "Tallahassee"],
                        ["Illinois", "Springfield"], ["Washington", "Olympia"], ["Colorado", "Denver"], ["Arizona", "Phoenix"],
                        ["Ohio", "Columbus"], ["Georgia", "Atlanta"], ["Massachusetts", "Boston"], ["Oregon", "Salem"],
                        ["Nevada", "Carson City"], ["Pennsylvania", "Harrisburg"], ["Michigan", "Lansing"]]
                },
                {
                    name: "Cell biology", sub: "Biology · 11 cards", f: "Term", b: "Function", cards: [
                        ["Nucleus", "Stores DNA and controls cell activity"], ["Mitochondria", "Releases energy (ATP) for the cell"],
                        ["Ribosome", "Builds proteins"], ["Chloroplast", "Site of photosynthesis in plant cells"],
                        ["Cell membrane", "Controls what enters and leaves the cell"], ["Cell wall", "Rigid outer layer of plant cells"],
                        ["Vacuole", "Stores water, nutrients and waste"], ["Golgi apparatus", "Packages and ships proteins"],
                        ["Endoplasmic reticulum", "Makes and transports proteins and lipids"], ["Lysosome", "Breaks down waste and old parts"],
                        ["Cytoplasm", "Gel-like fluid that holds the organelles"]]
                },
            ];

            const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
            const btn = (label, cls, fn) => { const b = h("button", "btn " + (cls || ""), label); b.type = "button"; b.onclick = fn; return b; };
            const shuffle = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = (Math.random() * (k + 1)) | 0;[a[k], a[j]] = [a[j], a[k]]; } return a; };

            let di = 0, mode = "cards", order = [], i = 0, flipped = false, quiz = null;
            const known = {};
            try { const s = JSON.parse(localStorage.getItem("lumen:known") || "{}"); for (const k in s) known[k] = new Set(s[k]); } catch { }
            const saveKnown = () => { try { localStorage.setItem("lumen:known", JSON.stringify(Object.fromEntries(Object.entries(known).map(([k, v]) => [k, [...v]])))); } catch { } };
            const kn = () => known[di] || (known[di] = new Set());

            function setDeck(n) {
                di = n; order = DECKS[n].cards.map((_, k) => k); i = 0; flipped = false; quiz = null;
                if (mode === "quiz") startQuiz();
                render();
            }
            function setMode(m) { mode = m; flipped = false; if (m === "quiz") startQuiz(); render(); }

            /* ── flashcards ── */
            const flip = () => { if (mode !== "cards") return; flipped = !flipped; render(); };
            const next = () => { i = (i + 1) % order.length; flipped = false; render(); };
            const prev = () => { i = (i - 1 + order.length) % order.length; flipped = false; render(); };
            const mark = ok => { const s = kn(); ok ? s.add(order[i]) : s.delete(order[i]); saveKnown(); next(); };

            function renderCards() {
                const D = DECKS[di], c = D.cards[order[i]];
                const fc = h("div", "fc" + (flipped ? " flip" : ""));
                const front = h("div", "face front"), back = h("div", "face back");
                front.append(h("small", null, D.f), h("p", null, c[0]));
                back.append(h("small", null, D.b), h("p", null, c[1]));
                fc.append(front, back);
                fc.onclick = flip;
                const nav = h("div", "ctl");
                nav.append(btn("←", "", prev), btn("Flip", "", flip), btn("→", "", next), btn("Shuffle", "", () => { order = shuffle(order); i = 0; flipped = false; render(); }));
                const rate = h("div", "ctl");
                rate.append(btn("Still learning", "", () => mark(false)), btn("Got it", "ok", () => mark(true)));
                $("#stage").replaceChildren(fc, nav, rate);
                $("#count").textContent = `Card ${i + 1} of ${order.length} · mastered ${kn().size} of ${D.cards.length}`;
                $("#pbar").style.width = (kn().size / D.cards.length * 100) + "%";
                $("#keys").textContent = "space: flip · ← →: browse · 1: still learning · 2: got it";
            }

            /* ── quiz ── */
            function startQuiz() {
                const D = DECKS[di], all = D.cards.map((_, k) => k);
                quiz = {
                    q: 0, score: 0, picked: -1,
                    qs: shuffle(all).slice(0, 10).map(ci => {
                        const wrong = shuffle(all.filter(k => k !== ci && D.cards[k][1] !== D.cards[ci][1])).slice(0, 3);
                        return { ci, opts: shuffle([ci, ...wrong]) };
                    }),
                };
            }
            const pick = n => { if (mode !== "quiz" || !quiz || quiz.q >= quiz.qs.length || quiz.picked !== -1) return; const q = quiz.qs[quiz.q]; if (n >= q.opts.length) return; quiz.picked = n; if (q.opts[n] === q.ci) quiz.score++; render(); };
            const nextQ = () => { if (!quiz || quiz.picked === -1) return; quiz.q++; quiz.picked = -1; render(); };

            function renderQuiz() {
                const D = DECKS[di], total = quiz.qs.length;
                $("#pbar").style.width = (quiz.q / total * 100) + "%";
                if (quiz.q >= total) {
                    const d = h("div", "done");
                    d.append(h("b", null, `${quiz.score}/${total}`), h("p", null, quiz.score === total ? "Perfect score!" : "Nice work. Keep practicing."));
                    const c = h("div", "ctl"); c.append(btn("Try again", "main", () => { startQuiz(); render(); }));
                    $("#stage").replaceChildren(d, c);
                    $("#count").textContent = "Quiz complete";
                    $("#keys").textContent = "";
                    return;
                }
                const q = quiz.qs[quiz.q], box = h("div", "q");
                box.append(h("small", null, D.f), h("p", null, D.cards[q.ci][0]));
                const list = h("div");
                q.opts.forEach((o, n) => {
                    const b = h("button", "opt"); b.type = "button";
                    if (quiz.picked !== -1) b.classList.add(o === q.ci ? "right" : n === quiz.picked ? "wrong" : "x");
                    b.append(h("i", null, String(n + 1)), h("span", null, D.cards[o][1]));
                    b.onclick = () => pick(n);
                    list.append(b);
                });
                const c = h("div", "ctl");
                if (quiz.picked !== -1) c.append(btn(quiz.q + 1 === total ? "See score" : "Next", "main", nextQ));
                $("#stage").replaceChildren(box, list, c);
                $("#count").textContent = `Question ${quiz.q + 1} of ${total} · score ${quiz.score}`;
                $("#keys").textContent = "1–4: choose an answer · space: next";
            }

            /* ── layout ── */
            function render() {
                $("#decks").replaceChildren(...DECKS.map((D, n) => {
                    const b = h("button", "deck" + (n === di ? " on" : "")); b.type = "button";
                    b.append(h("b", null, D.name), h("small", null, D.sub));
                    b.onclick = () => setDeck(n);
                    return b;
                }));
                $("#title").textContent = DECKS[di].name;
                $("#modes").replaceChildren(...[["cards", "Flashcards"], ["quiz", "Quiz"]].map(([k, t]) => {
                    const b = h("button", mode === k ? "on" : "", t); b.type = "button"; b.onclick = () => setMode(k); return b;
                }));
                mode === "cards" ? renderCards() : renderQuiz();
            }

            /* ── unlock ──
               Nothing on this page takes letters, so typing the phrase anywhere is enough. Nothing
               changes on screen until it matches. Digits, space and arrows are used by the page and
               reset the buffer, so normal use can't spell it. */
            let buf = "";
            function watch(e) {
                if (e.key === "Backspace") buf = buf.slice(0, -1);
                else if (/^[a-z]$/i.test(e.key)) buf = (buf + e.key.toLowerCase()).slice(-PASS.length);
                else if (e.key.length === 1 || e.key === "Enter" || e.key === "Tab") buf = "";
                if (buf !== PASS) return false;
                buf = "";
                try { parent.silence.unlock(); } catch { }
                return true;
            }

            addEventListener("keydown", e => {
                if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
                if (watch(e)) return;
                if (e.key === " ") { e.preventDefault(); mode === "cards" ? flip() : nextQ(); }
                else if (e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); mode === "cards" ? next() : nextQ(); }
                else if (e.key === "ArrowLeft" && mode === "cards") { e.preventDefault(); prev(); }
                else if (/^[1-4]$/.test(e.key)) { mode === "cards" ? (e.key === "1" ? mark(false) : e.key === "2" ? mark(true) : 0) : pick(+e.key - 1); }
            });

            setDeck(0);
        })();
    </script>
</body>

</html>
