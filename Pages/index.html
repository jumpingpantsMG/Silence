<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>silence · games</title>
    <meta name="description" content="silence. play quietly.">
    <meta name="theme-color" content="#08080a">
    <link rel="icon" href="../Silence-logo-dark.png" type="image/png">
    <link rel="stylesheet" href="../style.css">
    <script src="../js/Navbar.js"></script>
    <style>
        .rdlg {
            background: var(--panel);
            color: var(--fg);
            border: 1px solid var(--line-2);
            border-radius: 20px;
            padding: 22px;
            width: min(460px, calc(100vw - 28px));
            box-shadow: 0 30px 80px -20px #000;
        }

        .rdlg::backdrop {
            background: rgba(0, 0, 0, .7);
        }

        .rdlg h3 {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .rdlg .r-game {
            margin: 4px 0 16px;
            color: var(--muted);
            font-size: .82rem;
        }

        .rdlg textarea {
            min-height: 90px;
        }
    </style>
</head>

<body>

    <main class="wrap">
        <section class="hero">
            <h1>play quietly.</h1>
            <p>a calm, fast library of games. no noise.</p>
            <label class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <circle cx="11" cy="11" r="7" />
                    <path d="m20 20-3.5-3.5" />
                </svg>
                <input id="q" type="search" placeholder="search games" autocomplete="off" spellcheck="false">
                <kbd>/</kbd>
            </label>
        </section>

        <div class="bar">
            <div class="chips" id="chips">
                <button class="chip on" data-t="all">all</button>
                <button class="chip" data-t="fav">favorites</button>
                <button class="chip" data-t="recent">recent</button>
                <button class="chip" data-t="html5">html5</button>
                <button class="chip" data-t="flash">flash</button>
            </div>
            <button class="btn sm" id="rand" type="button">random game</button>
            <span class="count" id="count"></span>
        </div>

        <section class="grid" id="grid"></section>
        <p class="empty" id="empty">nothing here. try another search.</p>
    </main>

    <footer>
        <div class="wrap"><span>silence</span><span>← back leaves a game</span></div>
    </footer>

    <div class="player" id="player" role="dialog" aria-modal="true" aria-label="Game player">
        <div class="pbar">
            <button class="pbtn" id="p-close" title="Close (Esc)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                    stroke-linecap="round">
                    <path d="M15 5l-7 7 7 7" />
                </svg><span>back</span>
            </button>
            <h2 id="p-title"></h2>
            <button class="pbtn" id="p-share" title="Copy link to this game">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path
                        d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" />
                </svg><span>share</span>
            </button>
            <button class="pbtn" id="p-report" title="Report this game as broken">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 21V4M5 4h11l-2 4 2 4H5" />
                </svg><span>report</span>
            </button>
            <button class="pbtn" id="p-reload" title="Reload">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-3-6.7" />
                    <path d="M21 4v5h-5" />
                </svg><span>reload</span>
            </button>
            <button class="pbtn" id="p-full" title="Fullscreen">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
                </svg><span>fullscreen</span>
            </button>
        </div>
        <div class="toast" id="toast" role="status"></div>
        <div class="pframe" id="pframe">
            <div class="spin" id="spin"></div>
        </div>
        <dialog class="rdlg" id="rdlg" aria-labelledby="r-title">
            <h3 id="r-title">what's wrong?</h3>
            <p class="r-game" id="r-game"></p>

            <div class="chips" id="r-reasons" role="group" aria-label="What went wrong">
                <button class="chip" type="button">won't load / blank screen</button>
                <button class="chip" type="button">crashes or freezes</button>
                <button class="chip" type="button">controls don't work</button>
                <button class="chip" type="button">no sound</button>
                <button class="chip" type="button">runs slow</button>
                <button class="chip" type="button">something else</button>
            </div>

            <div class="field">
                <label for="r-details">More details <span id="r-opt" style="opacity:.6">(optional)</span></label>
                <textarea id="r-details" maxlength="400" rows="3"
                    placeholder="what happened? what did you click or press?"></textarea>
                <div class="hint"><span class="err" id="r-err"></span><span id="r-ctr">0 / 400</span></div>
            </div>

            <div class="actions">
                <button class="btn primary" id="r-send" type="button">send report</button>
                <button class="btn" id="r-cancel" type="button">cancel</button>
            </div>
        </dialog>
    </div>

    <!--
  Catalog. Format: name|folder|cover|f   (f = flash)
  Lines after "#non-semag" live in the non-semag/ folder, everything else in semag/.
-->

    <script>
        (async () => {
            /* ───────── config ───────── */
            const R2 = "https://r2-temp.app";
            // Each game lives at  {R2}/{bucket}/{folder}/index.html  with its cover next to it.

            const $ = s => document.querySelector(s);
            const grid = $("#grid"), q = $("#q"), count = $("#count"), empty = $("#empty");
            const player = $("#player"), pframe = $("#pframe"), spin = $("#spin"), toastEl = $("#toast");

            const response = await fetch("../data/Games-data.txt");

            if (!response.ok) {
                throw new Error("Failed to load Games-data.txt");
            }

            const dataText = await response.text();

            /* ───────── parse catalog ───────── */
            let bucket = "semag";
            const GAMES = [];
            for (const raw of dataText.split("\n")) {
                const line = raw.trim();
                if (!line) continue;
                if (line.startsWith("#")) { bucket = line.slice(1).trim(); continue; }
                const [name, dir, image, flag] = line.split("|");
                GAMES.push({ name, dir, image: image || "", flash: flag === "f", bucket });
            }
            GAMES.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));

            /* ───────── saved lists (this browser only) ───────── */
            const FAV_KEY = "silence:favs", REC_KEY = "silence:recent", RECENT_MAX = 24;
            const load = k => { try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; } catch { return []; } };
            const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { } };
            const favs = new Set(load(FAV_KEY));
            let recent = load(REC_KEY);

            let tt;
            function toast(msg, bad) {
                toastEl.textContent = msg;
                toastEl.classList.toggle("err", !!bad);
                toastEl.classList.add("show");
                clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("show"), 2600);
            }

            /* ───────── helpers ───────── */
            const enc = p => p.split("/").map(encodeURIComponent).join("/");
            const base = g => `${R2}/${g.bucket}/${enc(g.dir)}`;
            const gameUrl = g => `${base(g)}/index.html`;
            const coverUrl = g => g.image ? `${base(g)}/${enc(g.image)}` : "";
            const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
            const initial = n => (n.match(/[a-z0-9]/i) || ["·"])[0].toUpperCase();

            function toggleFav(g, btn) {
                favs.has(g.dir) ? favs.delete(g.dir) : favs.add(g.dir);
                store(FAV_KEY, [...favs]);
                if (type === "fav") render();                       // drop it from the favorites view right away
                else btn.classList.toggle("on", favs.has(g.dir));
            }

            /* ───────── cards ───────── */
            function card(g, i) {
                const h = hue(g.name);
                const el = document.createElement("button");
                el.className = "card";
                el.type = "button";
                el.setAttribute("aria-label", `Play ${g.name}`);

                const art = document.createElement("div");
                art.className = "art";
                const glow = document.createElement("div");
                glow.className = "glow";
                glow.style.background =
                    `radial-gradient(120% 120% at 20% 0%, hsl(${h} 70% 45% / .55), transparent 60%),` +
                    `radial-gradient(100% 100% at 100% 100%, hsl(${(h + 60) % 360} 70% 40% / .4), transparent 60%)`;
                const letter = document.createElement("b");
                letter.textContent = initial(g.name);
                art.append(glow, letter);

                const url = coverUrl(g);
                if (url) {
                    const blur = document.createElement("div");
                    blur.className = "blur";
                    const img = new Image();
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.alt = "";
                    img.referrerPolicy = "no-referrer";
                    img.onload = () => {
                        blur.style.backgroundImage = `url("${url}")`;
                        art.classList.add("loaded");
                    };
                    img.onerror = () => img.remove();
                    img.src = url;
                    art.prepend(blur);
                    art.append(img);
                }

                const play = document.createElement("div");
                play.className = "play";
                play.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M7 4v16l13-8z"/></svg>';

                const meta = document.createElement("div");
                meta.className = "meta";
                const title = document.createElement("h3");
                title.textContent = g.name;
                meta.append(title);

                // star: a span (not a button) because it sits inside the card button
                const fav = document.createElement("span");
                fav.className = "fav" + (favs.has(g.dir) ? " on" : "");
                fav.setAttribute("role", "button");
                fav.setAttribute("aria-label", `Favorite ${g.name}`);
                fav.title = "favorite";
                fav.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
                fav.addEventListener("click", e => { e.stopPropagation(); toggleFav(g, fav); });

                el.append(art, play, meta, fav);
                if (g.flash) {
                    const t = document.createElement("span");
                    t.className = "tag";
                    t.textContent = "flash";
                    el.append(t);
                }
                el.addEventListener("click", () => open(g));
                return el;
            }

            /* ───────── filter + render ───────── */
            const EMPTY = { fav: "no favorites yet. tap the star on a game.", recent: "nothing played yet.", all: "nothing here. try another search." };
            let type = "all", shown = [];
            function render() {
                const term = q.value.trim().toLowerCase();
                let list;
                if (type === "fav") list = GAMES.filter(g => favs.has(g.dir));
                else if (type === "recent") list = recent.map(d => GAMES.find(g => g.dir === d)).filter(Boolean);   // most recent first
                else if (type === "all") list = GAMES;
                else list = GAMES.filter(g => (type === "flash") === g.flash);
                shown = list.filter(g => g.name.toLowerCase().includes(term));

                const frag = document.createDocumentFragment();
                shown.forEach((g, i) => frag.append(card(g, i)));
                grid.replaceChildren(frag);
                empty.textContent = (!term && EMPTY[type]) || EMPTY.all;
                empty.style.display = shown.length ? "none" : "block";
                count.textContent = `${shown.length} game${shown.length === 1 ? "" : "s"}`;
            }

            $("#chips").addEventListener("click", e => {
                const b = e.target.closest(".chip"); if (!b) return;
                type = b.dataset.t;
                document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
                render();
            });
            let t;
            q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 90); });

            // random pick from whatever is currently listed
            $("#rand").addEventListener("click", () => {
                const pool = shown.length ? shown : GAMES;
                open(pool[Math.floor(Math.random() * pool.length)]);
            });

            /* ───────── player ───────── */
            let frame = null, current = null;

            // keep the address bar on "#/index?play=<game>" while a game is open (replaceState: no reload, no history spam)
            const setHash = id => {
                try {
                    const p = window.parent;
                    p.history.replaceState(null, "", p.location.pathname + p.location.search + (id ? "#/index?play=" + encodeURIComponent(id) : ""));
                } catch { }
            };

            function open(g) {
                current = g;
                recent = [g.dir, ...recent.filter(d => d !== g.dir)].slice(0, RECENT_MAX);
                store(REC_KEY, recent);
                setHash(g.dir);
                $("#p-title").textContent = g.name;
                spin.style.display = "block";
                frame?.remove();
                frame = document.createElement("iframe");
                frame.title = g.name;
                frame.allow = "fullscreen; gamepad; autoplay; clipboard-write; accelerometer; gyroscope";
                frame.allowFullscreen = true;
                frame.setAttribute("sandbox",
                    "allow-scripts allow-same-origin allow-pointer-lock allow-popups allow-forms allow-modals allow-downloads allow-orientation-lock");
                frame.addEventListener("load", () => { spin.style.display = "none"; frame.focus(); });
                frame.src = gameUrl(g);
                pframe.append(frame);
                player.classList.add("open");
                document.body.classList.add("playing");
            }
            function close() {
                if (!player.classList.contains("open")) return;
                if (document.fullscreenElement) document.exitFullscreen?.();
                player.classList.remove("open");
                document.body.classList.remove("playing");
                frame?.remove(); frame = null; current = null;
                setHash("");
                if (type === "recent") render();                    // order changed while playing
            }
            $("#p-close").addEventListener("click", close);
            $("#p-reload").addEventListener("click", () => { if (current) open(current); });
            $("#p-full").addEventListener("click", () => {
                (frame || pframe).requestFullscreen?.().catch(() => { });
            });

            /* share: copies a link that opens this game straight away */
            $("#p-share").addEventListener("click", async () => {
                if (!current) return;
                let link = "";
                try { const p = window.parent; link = `${p.location.origin}${p.location.pathname}#/index?play=${encodeURIComponent(current.dir)}`; } catch { }
                if (!link) return toast("couldn't make a link", true);
                try { await navigator.clipboard.writeText(link); toast("link copied"); } catch { prompt("copy this link", link); }
            });

            /* report: ask what's wrong, then send it as a bug report through the forms api */
            const LAST = "silence:lastForm";
            const OTHER = "something else";
            const rdlg = $("#rdlg"), rErr = $("#r-err"), rDet = $("#r-details"), rSend = $("#r-send");
            let reporting = null, reason = "";

            const cooldown = () => { try { return Math.max(0, 30000 - (Date.now() - +localStorage.getItem(LAST))); } catch { return 0; } };

            function setReason(btn) {
                reason = btn ? btn.textContent : "";
                document.querySelectorAll("#r-reasons .chip").forEach(c => c.classList.toggle("on", c === btn));
                $("#r-opt").hidden = reason === OTHER;           // "something else" needs details
                rErr.textContent = "";
            }
            $("#r-reasons").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setReason(b); });
            rDet.addEventListener("input", () => { $("#r-ctr").textContent = `${rDet.value.length} / 400`; });
            $("#r-cancel").addEventListener("click", () => rdlg.close());

            $("#p-report").addEventListener("click", () => {
                if (!current) return;
                const w = cooldown();
                if (w) return toast(`wait ${Math.ceil(w / 1000)}s before reporting again`, true);
                reporting = current;                              // remember which game, even if the player changes
                $("#r-game").textContent = reporting.name;
                setReason(null);
                rDet.value = ""; $("#r-ctr").textContent = "0 / 400";
                rdlg.showModal();
            });

            rSend.addEventListener("click", async () => {
                const g = reporting;
                if (!g) return;
                const details = rDet.value.trim();
                if (!reason) { rErr.textContent = "pick what went wrong"; return; }
                if (reason === OTHER && details.length < 5) { rErr.textContent = "tell us a bit more"; rDet.focus(); return; }
                const w = cooldown();
                if (w) { rErr.textContent = `wait ${Math.ceil(w / 1000)}s before reporting again`; return; }

                rSend.disabled = true; rSend.textContent = "sending…"; rErr.textContent = "";
                try {
                    const r = await fetch("/api/forms", {
                        method: "POST",
                        headers: { "content-type": "application/json" },
                        body: JSON.stringify({
                            type: "bug", name: "", contact: "", website: "",
                            subject: g.name,
                            // the reason comes first so the admin list preview is useful at a glance
                            message: `${reason}${details ? " — " + details : ""}\n\ngame: ${g.bucket}/${g.dir}`,
                        }),
                    });
                    if (r.status === 429) throw new Error("too many reports, try again in a minute");
                    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "couldn't send, try again");
                    try { localStorage.setItem(LAST, Date.now()); } catch { }
                    rdlg.close();
                    toast("thanks, reported");
                } catch (ex) {
                    rErr.textContent = ex.message || "couldn't send, try again";   // inline: the dialog covers the toast
                } finally { rSend.disabled = false; rSend.textContent = "send report"; }
            });

            /* ───────── share links: the shell fires "silence:route" whenever this page is shown ───────── */
            function routePlay() {
                let id = "";
                try { id = new URLSearchParams(window.parent.location.hash.split("?")[1] || "").get("play") || ""; } catch { }
                const g = id && GAMES.find(x => x.dir === id);
                if (g && (!current || current.dir !== g.dir)) open(g);
            }
            addEventListener("silence:route", routePlay);

            /* ───────── keys ───────── */
            addEventListener("keydown", e => {
                if (rdlg.open) return;          // esc closes just the dialog
                if (e.key === "Escape") { close(); q.blur(); return; }
                if (player.classList.contains("open")) return;
                if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
                if (e.key === "Enter" && document.activeElement === q && shown[0]) open(shown[0]);
            });

            render();
        })();
    </script>
</body>

</html>
