<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>silence · projects</title>
    <meta name="description" content="What's being built at silence.">
    <meta name="theme-color" content="#08080a">
    <link rel="icon" href="../Silence-logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap">
    <script src="../js/Navbar.js"></script>
    <style>
        :root {
            --bg: #08080a;
            --panel: #0f0f13;
            --line: rgba(255, 255, 255, .07);
            --fg: #ececf1;
            --muted: #767683;
            --accent: #8b7cff;
            --accent2: #5ce1c6;
            --warn: #f3b562;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            font-family: "Funnel Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(900px circle at 50% -10%, rgba(139, 124, 255, .12), transparent 60%);
            background-repeat: no-repeat;
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px
        }

        .wide {
            max-width: 1160px
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(14px);
            background: rgba(8, 8, 10, .7);
            border-bottom: 1px solid var(--line)
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px
        }

        .logo {
            font-weight: 300;
            font-size: 1.25rem;
            letter-spacing: -.03em
        }

        .links {
            display: flex;
            gap: 6px
        }

        .links a {
            padding: 8px 14px;
            border-radius: 999px;
            font-size: .85rem;
            color: var(--muted);
            transition: .2s
        }

        .links a:hover {
            color: var(--fg);
            background: rgba(255, 255, 255, .05)
        }

        .links a.on {
            color: var(--fg);
            background: rgba(255, 255, 255, .07)
        }

        .head {
            padding: 84px 0 36px
        }

        .head h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 200;
            letter-spacing: -.04em;
            line-height: 1.05;
            background: linear-gradient(180deg, #fff 30%, #74747f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .head p {
            margin-top: 14px;
            color: var(--muted);
            max-width: 46ch;
            line-height: 1.55
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin: 8px 0 28px;
            flex-wrap: wrap
        }

        .tab {
            padding: 7px 15px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: transparent;
            color: var(--muted);
            font: inherit;
            font-size: .8rem;
            cursor: pointer;
            transition: .2s;
        }

        .tab:hover {
            color: var(--fg);
            border-color: rgba(255, 255, 255, .18)
        }

        .tab.on {
            color: #0a0a0c;
            background: var(--fg);
            border-color: var(--fg)
        }

        .list {
            display: grid;
            gap: 14px;
            padding-bottom: 100px
        }

        .proj {
            display: grid;
            grid-template-columns: 56px 1fr auto;
            gap: 18px;
            align-items: center;
            padding: 20px;
            border-radius: 18px;
            background: var(--panel);
            border: 1px solid var(--line);
            transition: transform .3s cubic-bezier(.2, .7, .2, 1), border-color .3s;
            animation: in .5s both;
        }

        .proj:hover {
            transform: translateY(-3px);
            border-color: rgba(255, 255, 255, .16)
        }

        .icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.5rem;
            font-weight: 200;
            color: #fff;
        }

        .body h3 {
            font-size: 1rem;
            font-weight: 500
        }

        .body p {
            margin-top: 4px;
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.45
        }

        .bar {
            margin-top: 12px;
            height: 3px;
            border-radius: 3px;
            background: rgba(255, 255, 255, .07);
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2))
        }

        .status {
            font-size: .72rem;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--line);
            color: var(--muted);
            white-space: nowrap;
        }

        .status.live {
            color: var(--accent2);
            border-color: rgba(92, 225, 198, .3);
            background: rgba(92, 225, 198, .06)
        }

        .status.building {
            color: var(--warn);
            border-color: rgba(243, 181, 98, .3);
            background: rgba(243, 181, 98, .06)
        }

        .status.idea {
            color: var(--accent);
            border-color: rgba(139, 124, 255, .3);
            background: rgba(139, 124, 255, .06)
        }

        .empty {
            display: none;
            text-align: center;
            color: var(--muted);
            padding: 40px 0 120px
        }

        footer {
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: .78rem
        }

        footer .wrap {
            display: flex;
            justify-content: space-between;
            padding: 26px 24px;
            max-width: 1160px
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        @media (max-width:560px) {
            .proj {
                grid-template-columns: 48px 1fr
            }

            .status {
                grid-column: 2;
                justify-self: start
            }

            .icon {
                width: 48px;
                height: 48px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>

<body>

    <main class="wrap">
        <section class="head">
            <h1>projects</h1>
            <p>what's live, what's in progress, and what's still an idea.</p>
        </section>

        <div class="tabs" id="tabs"></div>
        <section class="list" id="list"></section>
        <p class="empty" id="empty">nothing in this stage yet.</p>
    </main>

    <footer>
        <div class="wrap"><span>silence</span><span id="count"></span></div>
    </footer>

    <script>
        // status: "live" | "building" | "idea"  ·  progress: 0–100
        const PROJECTS = [
            { name: "Drift", desc: "Minimal top-down racer with ghost laps.", status: "live", progress: 100 },
            { name: "Hollow", desc: "Light-and-shadow puzzle, one tap controls.", status: "live", progress: 100 },
            { name: "Tidal", desc: "Rhythm arcade driven by wave physics.", status: "building", progress: 68 },
            { name: "Ember", desc: "Fast action roguelite with tiny runs.", status: "building", progress: 42 },
            { name: "Monolith", desc: "Slow-burn strategy on a single shared map.", status: "building", progress: 20 },
            { name: "Quiet Hours", desc: "Ambient puzzle collection, no timers, no scores.", status: "idea", progress: 5 },
            { name: "Parallax", desc: "Depth-based platformer experiment.", status: "idea", progress: 0 },
        ];

        const $ = s => document.querySelector(s);
        const hue = str => [...str].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
        const stages = ["all", "live", "building", "idea"];
        let stage = "all";

        $("#tabs").innerHTML = stages.map(s => `<button class="tab${s === "all" ? " on" : ""}" data-s="${s}">${s}</button>`).join("");
        $("#tabs").addEventListener("click", e => {
            const b = e.target.closest(".tab"); if (!b) return;
            stage = b.dataset.s;
            document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t === b));
            render();
        });

        function render() {
            const list = PROJECTS.filter(p => stage === "all" || p.status === stage);
            $("#list").innerHTML = list.map((p, i) => {
                const h = hue(p.name);
                return `<article class="proj" style="animation-delay:${i * 40}ms">
        <div class="icon" style="background:linear-gradient(135deg,hsl(${h} 65% 48%),hsl(${(h + 55) % 360} 65% 32%))">${p.name[0]}</div>
        <div class="body">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          ${p.status === "live" ? "" : `<div class="bar"><i style="width:${p.progress}%"></i></div>`}
        </div>
        <span class="status ${p.status}">${p.status}</span>
      </article>`;
            }).join("");
            $("#empty").style.display = list.length ? "none" : "block";
            $("#count").textContent = `${list.length} project${list.length === 1 ? "" : "s"}`;
        }
        render();
    </script>
</body>

</html>
