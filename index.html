<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>tempo · typing test</title>
    <meta name="description" content="a minimal typing test">
    <meta name="theme-color" content="#08080a">
    <link rel="icon" id="icon" href="data:,">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Funnel+Sans:ital,wght@0,300..800;1,300..800&display=swap">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-31QG6BF8ZS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }

    <style>
        /* The shell keeps this small block inline on purpose: it has to paint the
     loader before any network request (CDN or style.css) has finished.
     Every page it loads uses /style.css instead. */
        :root {
            color-scheme: dark;
            --bg: #08080a;
            --panel: #0f0f13;
            --line: rgba(255, 255, 255, .08);
            --fg: #ececf1;
            --muted: #767683;
            --accent: #8b7cff;
            --accent2: #5ce1c6;
            --ease: cubic-bezier(.2, .7, .2, 1);
            --font: "Funnel Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            background: var(--bg)
        }

        body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            color: var(--fg);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        /* stage: one iframe per page, all kept alive, only one visible */
        #stage {
            position: absolute;
            inset: 0
        }

        .page-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: var(--bg);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .25s var(--ease), visibility 0s .25s;
        }

        .page-frame.on {
            z-index: 1;
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity .25s var(--ease);
        }

        /* loader */
        .loader {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            z-index: 2;
            background:
                radial-gradient(700px circle at 50% 42%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%),
                radial-gradient(900px circle at 85% 115%, color-mix(in srgb, var(--accent2) 8%, transparent), transparent 60%),
                var(--bg);
            transition: opacity .45s var(--ease), visibility .45s;
        }

        body.ready .loader {
            opacity: 0;
            visibility: hidden;
            pointer-events: none
        }

        .loader::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: .05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        }

        .mark {
            position: relative;
            text-align: center;
            font-size: clamp(2.6rem, 9vw, 5.5rem);
            font-weight: 200;
            letter-spacing: -.045em;
            line-height: 1;
            background: linear-gradient(180deg, #fff 25%, #6a6a76 115%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: breathe 2.4s ease-in-out infinite;
        }

        .mark small {
            display: block;
            margin-top: 16px;
            font-size: .68rem;
            font-weight: 400;
            letter-spacing: .34em;
            text-transform: uppercase;
            -webkit-text-fill-color: var(--muted);
        }

        @keyframes breathe {

            0%,
            100% {
                opacity: .55
            }

            50% {
                opacity: 1
            }
        }

        body.locked .mark {
            visibility: hidden
        }

        /* no brand text while locked */

        .bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            z-index: 3;
            overflow: hidden;
            opacity: 0;
            transition: opacity .3s
        }

        body.loading .bar,
        body.busy .bar {
            opacity: 1
        }

        .bar::before {
            content: "";
            position: absolute;
            inset: 0;
            width: 40%;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
            animation: sweep 1.1s var(--ease) infinite;
        }

        @keyframes sweep {
            from {
                transform: translateX(-100%)
            }

            to {
                transform: translateX(250%)
            }
        }

        /* error */
        .error {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: none;
            place-items: center;
            padding: 24px;
            background: var(--bg)
        }

        body.failed .error {
            display: grid
        }

        body.failed .loader {
            opacity: 0;
            visibility: hidden
        }

        .card {
            width: min(420px, 100%);
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .01)), var(--panel);
            border: 1px solid var(--line);
            box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8);
            animation: pop .5s var(--ease) both;
        }

        .card h2 {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: -.01em
        }

        .card p {
            margin-top: 8px;
            color: var(--muted);
            font-size: .88rem;
            line-height: 1.55
        }

        .card code {
            display: block;
            margin-top: 14px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--line);
            color: #a9a9b6;
            font: .72rem/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
            word-break: break-all;
            text-align: left;
        }

        .btn {
            margin-top: 20px;
            padding: 11px 24px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .12);
            background: rgba(255, 255, 255, .04);
            font-size: .85rem;
            letter-spacing: .02em;
            transition: border-color .25s, background .25s, transform .25s var(--ease);
        }

        .btn:hover {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 14%, transparent);
            transform: translateY(-2px)
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(12px) scale(.98)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        /* optional panic button: small, dim, bottom-left, only while unlocked */
        #panic {
            display: none;
            position: fixed;
            z-index: 30;
            left: 10px;
            bottom: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, .05);
            color: var(--muted);
            font-size: 1rem;
            line-height: 1;
            opacity: .35;
            transition: opacity .2s;
        }

        #panic:hover,
        #panic:focus-visible {
            opacity: 1;
            color: var(--fg)
        }

        body.panicbtn:not(.locked) #panic {
            display: block
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition: none !important
            }
        }

        :root[data-motion=reduced] *,
        :root[data-motion=reduced] *::before,
        :root[data-motion=reduced] *::after {
            animation: none !important;
            transition: none !important
        }
    </style>
</head>

<body class="loading">
    <script>try { if (sessionStorage.getItem("silence:unlocked") !== "1") document.body.classList.add("locked") } catch (e) { document.body.classList.add("locked") }</script>

    <div class="bar" aria-hidden="true"></div>
    <button id="panic" type="button" aria-label="close" title="close">×</button>

    <div class="loader" role="status" aria-live="polite">
        <div class="mark">silence<small>loading</small></div>
    </div>

    <div class="error" role="alert">
        <div class="card">
            <h2>couldn't load the page</h2>
            <p>It didn't come back from the CDN or from this site. Check your connection, or the repo settings in <code
                    style="display:inline;margin:0;padding:1px 6px">index.html</code>.</p>
            <code id="fail-url"></code>
            <button class="btn" id="retry">try again</button>
        </div>
    </div>

    <div id="stage"></div>

    <script>
        (() => {
            /* ───────── config ───────── */
            // Pages are fetched from jsDelivr:
            //   https://cdn.jsdelivr.net/gh/<repo>@<ref>/<dir><page>.html
            // If that fails (or the URL has ?local) they come from this site's own /pages folder.
            const CONFIG = {
                repo: "jumpingpantsmg/Silence",  // GitHub repo to fetch from
                ref: "main",          // branch, tag or commit SHA (a SHA skips CDN cache lag)
                dir: "Pages/",
                home: "index",
                timeout: 8000,
                // pages loaded quietly in the background after the first one, so even
                // the first visit to them is instant. Set to [] to turn this off.
                preload: ["index", "soundboard", "forms", "settings"],
            };
            const CDN = `https://cdn.jsdelivr.net/gh/${CONFIG.repo}@${CONFIG.ref}/`;
            const LOCAL = new URL("./", location.href).href;
            const LOCAL_FIRST = /[?&]local\b/.test(location.search) || location.hostname.includes("localhost")

            async function checkForUpdates(page = 1, perPage = 1) {
                try {
                    const apiUrl = `https://api.github.com/repos/jumpingpantsmg/Silence/commits?page=${page}&per_page=${perPage}`;

                    const res = await fetch(apiUrl);

                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }

                    const commits = await res.json();

                    if (!Array.isArray(commits) || commits.length === 0) {
                        return [];
                    }

                    return commits;
                } catch (err) {
                    console.warn("Update check failed:", err);
                    return [];
                }
            }

            const $ = s => document.querySelector(s);
            const stage = $("#stage");
            const cache = new Map();      // page name -> html text
            const pages = new Map();      // page name -> { el, ready }. iframes live for the whole session
            const titles = new Map();     // page name -> document title
            let token = 0, gen = 0, current = null, pageTitle = "silence";
            window.currentpage = CONFIG.home;  // for the shell to know which page is showing
            window.checkforupdates = checkForUpdates;

            const SANDBOX = "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox allow-forms allow-pointer-lock allow-modals allow-downloads allow-orientation-lock";
            const ALLOW = "fullscreen; gamepad; autoplay; clipboard-write; accelerometer; gyroscope";

            /* ───────── settings ─────────
               The settings page talks to this through  window.parent.silence.
               Stored in localStorage on this origin; applied to the shell and to
               every page iframe (hidden ones too). */
            const KEY = "silence:settings";
            const PRESETS = {                       // name: [accent, accent2]
                violet: ["#8b7cff", "#5ce1c6"],
                ocean: ["#5cb8ff", "#8b7cff"],
                mint: ["#5ce1c6", "#5cb8ff"],
                rose: ["#ff7aa8", "#f3b562"],
                amber: ["#f3b562", "#ff7aa8"],
                lime: ["#b6e86b", "#5ce1c6"],
            };
            const DENSITY = { compact: "165px", comfortable: "210px", large: "280px" };
            const PANIC_URL = "https://www.google.com";
            const DEFAULTS = {
                accent: "violet", density: "comfortable", motion: "full", title: "tempo · typing test", icon: "tempotype", customIcon: "",
                panicOn: true, panicKey: "Backquote", panicUrl: PANIC_URL, panicBtn: false, cloakRedirect: true,
                lockHidden: false, fresh: true,
            };

            // generic tab icons (original glyphs)
            const svg = b => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">${b}</svg>`);
            const ICONS = {
                none: "../Silence-logo-dark.png",
                tempotype: "../favicon.ico",
                document: svg('<path d="M8 3h11l6 6v20H8z" fill="#e8eaed"/><path d="M19 3l6 6h-6z" fill="#9aa0a6"/><path d="M11 15h10M11 19h10M11 23h7" stroke="#80868b" stroke-width="1.6"/>'),
                folder: svg('<path d="M3 8h9l3 3h14v16H3z" fill="#f2b84b"/>'),
                calendar: svg('<rect x="4" y="6" width="24" height="22" rx="3" fill="#fff" stroke="#9aa0a6" stroke-width="1.6"/><path d="M4 12h24" stroke="#9aa0a6" stroke-width="1.6"/><path d="M10 3v5M22 3v5" stroke="#9aa0a6" stroke-width="2"/>'),
                dot: svg('<circle cx="16" cy="16" r="9" fill="#9aa0a6"/>'),
            };

            // keys you type while using the site can't be the panic key
            const BAD_KEY = /^(Key|Digit|Numpad|Space$|Enter$|Tab$|Backspace$)/;
            const KEYNAMES = {
                Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\",
                Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/", Escape: "esc"
            };
            const keyLabel = c => KEYNAMES[c] || String(c).replace(/^(Key|Digit)/, "").toLowerCase();
            const keyOk = c => typeof c === "string" && /^[A-Za-z0-9]{1,20}$/.test(c) && !BAD_KEY.test(c);

            const cleanUrl = u => {
                u = String(u || "").trim().slice(0, 300);
                if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;
                return /^https?:\/\/[^\s/]+\.[^\s/]+/i.test(u) ? u : PANIC_URL;
            };
            const bool = (v, d) => (typeof v === "boolean" ? v : d);

            // custom tab icon: a small image data URL (from an upload) or an http(s) image URL
            const okIcon = u => typeof u === "string" && (
                (u.length <= 120000 && /^data:image\/(png|jpeg|gif|webp|x-icon|vnd\.microsoft\.icon|svg\+xml)[;,]/i.test(u)) ||
                (u.length <= 500 && /^https?:\/\/[^\s/]+\.[^\s/]+/i.test(u))
            );
            const iconHref = s => (s.icon === "custom" && s.customIcon) ? s.customIcon : (ICONS[s.icon] || ICONS.tempotype);
            const sanitize = s => {
                s = s && typeof s === "object" ? s : {};
                return {
                    accent: Object.hasOwn(PRESETS, s.accent) ? s.accent : DEFAULTS.accent,
                    density: Object.hasOwn(DENSITY, s.density) ? s.density : DEFAULTS.density,
                    motion: s.motion === "reduced" ? "reduced" : "full",
                    title: typeof s.title === "string" ? s.title.slice(0, 60) : DEFAULTS.title,   // missing = default; blank = use page name
                    icon: (Object.hasOwn(ICONS, s.icon) || s.icon === "custom") ? s.icon : DEFAULTS.icon,
                    customIcon: okIcon(s.customIcon) ? s.customIcon : "",
                    panicOn: bool(s.panicOn, DEFAULTS.panicOn),
                    panicKey: keyOk(s.panicKey) ? s.panicKey : DEFAULTS.panicKey,
                    panicUrl: cleanUrl(s.panicUrl),
                    panicBtn: bool(s.panicBtn, DEFAULTS.panicBtn),
                    cloakRedirect: bool(s.cloakRedirect, DEFAULTS.cloakRedirect),
                    lockHidden: bool(s.lockHidden, DEFAULTS.lockHidden),
                    fresh: bool(s.fresh, DEFAULTS.fresh),
                };
            };
            const read = () => {
                try { return sanitize(JSON.parse(localStorage.getItem(KEY) || "{}")); }
                catch { return sanitize({}); }
            };
            let cfg = read();                       // live copy the key handlers use
            const write = s => { cfg = sanitize(s); try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch { } };

            const roots = () => {
                const r = [document.documentElement];
                for (const f of stage.querySelectorAll("iframe")) {
                    try { const d = f.contentDocument; if (d && d.documentElement) r.push(d.documentElement); } catch { }
                }
                return r;
            };
            function apply() {
                const s = cfg = read(), [a, b] = PRESETS[s.accent];
                for (const root of roots()) {
                    root.style.setProperty("--accent", a);
                    root.style.setProperty("--accent2", b);
                    root.style.setProperty("--card-min", DENSITY[s.density]);
                    root.dataset.motion = s.motion;
                }
                const disguised = document.body.classList.contains("locked");
                document.title = disguised ? DEFAULTS.title : (s.title.trim() || pageTitle);
                $("#icon").href = disguised ? ICONS.tempotype : iconHref(s);
                document.body.classList.toggle("panicbtn", s.panicBtn);
            }
            // upload: shrink to a 64x64 PNG so it stays small in localStorage
            function iconFromFile(file) {
                return new Promise((resolve, reject) => {
                    if (!file || !/^image\//.test(file.type)) return reject(new Error("that's not an image"));
                    const raw = () => {                      // fallback: store the file as-is if it's small
                        if (file.size > 90000) return reject(new Error("image too large"));
                        const r = new FileReader();
                        r.onload = () => okIcon(r.result) ? resolve(r.result) : reject(new Error("unsupported image type"));
                        r.onerror = () => reject(new Error("couldn't read the file"));
                        r.readAsDataURL(file);
                    };
                    const url = URL.createObjectURL(file), img = new Image();
                    img.onload = () => {
                        try {
                            if (!img.width || !img.height) throw 0;
                            const c = document.createElement("canvas"); c.width = c.height = 64;
                            const k = Math.min(64 / img.width, 64 / img.height), w = img.width * k, h = img.height * k;
                            c.getContext("2d").drawImage(img, (64 - w) / 2, (64 - h) / 2, w, h);
                            resolve(c.toDataURL("image/png"));
                        } catch { raw(); }
                        finally { URL.revokeObjectURL(url); }
                    };
                    img.onerror = () => { URL.revokeObjectURL(url); raw(); };
                    img.src = url;
                });
            }

            // url: checks it actually loads as an image, then stores the url itself
            function iconFromUrl(u) {
                u = String(u || "").trim();
                if (u && !/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u;
                return new Promise((resolve, reject) => {
                    if (!okIcon(u)) return reject(new Error("not a valid image url"));
                    const img = new Image();
                    img.onload = () => resolve(u);
                    img.onerror = () => reject(new Error("couldn't load that image"));
                    img.src = u;
                });
            }

            function setCustomIcon(v) {                     // "" resets to the default (tempotype)
                write({ ...read(), icon: v ? "custom" : DEFAULTS.icon, customIcon: v || "" });
                apply();
            }
            window.silence = {
                read, write, apply, presets: PRESETS, defaults: DEFAULTS, icons: Object.keys(ICONS),
                keyLabel, keyOk, lock, unlock, panic, cloak, refresh, iconFromFile, iconFromUrl, setCustomIcon, info: () => ({ ref: lastRef, sha: /^[0-9a-f]{40}$/i.test(lastRef) }),
            };
            apply();

            /* ───────── lock ─────────
               Until the passphrase is typed on the disguise page, every route shows that page.
               Unlocked state lives in sessionStorage, so closing the tab locks it again. */
            const GATE = "silence:unlocked";
            let memUnlocked = false;
            const isUnlocked = () => {
                try { if (sessionStorage.getItem(GATE) === "1") return true; } catch { }
                return memUnlocked;
            };
            function unlock() {
                memUnlocked = true;
                try { sessionStorage.setItem(GATE, "1"); } catch { }
                document.body.classList.remove("locked");
                show(pageFromHash());
            }
            function lock() {
                memUnlocked = false;
                try { sessionStorage.removeItem(GATE); } catch { }
                document.body.classList.add("locked");
                history.replaceState(null, "", location.pathname + location.search);   // drop #/route from the URL
                purge();
                show(CONFIG.home);
            }
            // Panic: drop the unlocked state, throw away every page and send the whole tab somewhere boring.
            // In a cloaked (about:blank) window "top" is that window, so it gets sent too.
            function panic() {
                memUnlocked = false;
                try { sessionStorage.removeItem(GATE); } catch { }
                document.body.classList.add("locked");
                purge();
                const url = cfg.panicUrl;
                try { window.top.location.replace(url); } catch { location.replace(url); }
            }

            // Open the site inside an about:blank window so the address bar shows nothing.
            // Needs a click (popup rules). Optionally sends this tab to the panic URL.
            function cloak() {
                const w = window.open("about:blank", "_blank");
                if (!w) return false;
                try { w.sessionStorage.removeItem(GATE); } catch { }      // popups inherit sessionStorage: start the cloak locked
                const d = w.document;
                d.title = document.title;
                const ic = d.createElement("link"); ic.rel = "icon"; ic.href = $("#icon").href; d.head.append(ic);
                const st = d.createElement("style");
                st.textContent = "html,body{margin:0;height:100%;background:#08080a}iframe{border:0;width:100%;height:100%;display:block}";
                d.head.append(st);
                const f = d.createElement("iframe");
                f.src = location.href.split("#")[0];
                f.setAttribute("allow", "fullscreen; gamepad; autoplay; clipboard-write");
                f.setAttribute("allowfullscreen", "");
                d.body.append(f);
                if (cfg.cloakRedirect && window.top === window) location.replace(cfg.panicUrl);
                return true;
            }

            const hotkey = e => {
                if (e.altKey && e.shiftKey && e.code === "KeyL" && isUnlocked()) { e.preventDefault(); lock(); return; }   // Alt + Shift + L
                if (cfg.panicOn && e.code === cfg.panicKey && !e.ctrlKey && !e.metaKey && !e.altKey) { e.preventDefault(); panic(); }
            };
            addEventListener("keydown", hotkey);
            $("#panic").addEventListener("click", panic);
            document.addEventListener("visibilitychange", () => { if (document.hidden && cfg.lockHidden && isUnlocked()) lock(); });

            /* ───────── fetching ───────── */
            const pageFromHash = () => {
                const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
                return /^[\w-]+$/.test(h) ? h : CONFIG.home;
            };
            /* jsDelivr caches a branch (@main) for hours. With "fresh" on we ask GitHub which commit
               the branch is on right now and load from that exact SHA instead, which jsDelivr
               serves immediately and never caches stale. If GitHub can't be reached we fall back to
               the branch name. */
            let lastRef = CONFIG.ref, refP = null, failUrl = "";
            const isSha = r => /^[0-9a-f]{40}$/i.test(r);
            function resolveRef(force) {
                if (!cfg.fresh || isSha(CONFIG.ref) || /^YOUR_USER\//.test(CONFIG.repo)) return Promise.resolve(lastRef = CONFIG.ref);
                if (refP && !force) return refP;
                return refP = (async () => {
                    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 3500);
                    try {
                        const r = await fetch(`https://api.github.com/repos/${CONFIG.repo}/commits/${encodeURIComponent(CONFIG.ref)}`,
                            { headers: { Accept: "application/vnd.github.sha" }, signal: ctl.signal, cache: "no-store" });
                        if (!r.ok) throw new Error(r.status);
                        const sha = (await r.text()).trim();
                        return (lastRef = isSha(sha) ? sha : CONFIG.ref);
                    } catch { return (lastRef = CONFIG.ref); }
                    finally { clearTimeout(t); }
                })();
            }
            const sources = async name => {
                const base = `https://cdn.jsdelivr.net/gh/${CONFIG.repo}@${await resolveRef()}/`;
                const cdn = { url: `${base}${CONFIG.dir}${name}.html`, base };
                const local = { url: `${LOCAL}${CONFIG.dir}${name}.html`, base: LOCAL };
                return LOCAL_FIRST ? [local, cdn] : [cdn, local];
            };

            async function refresh() {            // forget everything and pull the newest commit
                cache.clear();
                const ref = await resolveRef(true);
                purge();
                await show(pageFromHash());
                return ref;
            }

            async function timedFetch(url) {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), CONFIG.timeout);
                try {
                    const res = await fetch(url, { signal: ctl.signal, cache: cfg.fresh ? "no-cache" : "default" });
                    if (!res.ok) throw new Error(res.status);
                    return await res.text();
                } finally { clearTimeout(t); }
            }

            // A page that says "../something.ext" (stylesheet, image, script, json...) means a
            // file at the repo root, but ../ means nothing inside a srcdoc. Point every one at
            // the place the page itself came from: jsDelivr normally. ../ links to .html pages
            // are left alone because the shell routes those itself.
            const ASSET = /(["'])\.\.\/([\w.%\/-]+\.[A-Za-z0-9]+)\1/g;
            const rewrite = (html, base) =>
                html.replace(ASSET, (m, q, p) => (/\.html?$/i.test(p) ? m : `${q}${base}${p}${q}`));

            // jsDelivr serves .html as text/plain, so the page can't be iframed by URL.
            // Fetch the source and hand it to the frame as srcdoc.
            async function getPage(name) {
                if (cache.has(name)) return cache.get(name);
                let lastErr;
                const list = await sources(name);
                failUrl = list[0].url;
                for (const src of list) {
                    try {
                        const html = rewrite(await timedFetch(src.url), src.base);
                        cache.set(name, html);
                        return html;
                    } catch (e) { lastErr = e; }
                }
                throw lastErr;
            }

            const setState = s => {
                document.body.classList.remove("loading", "ready", "failed");
                document.body.classList.add(s);
            };

            /* ───────── pages ─────────
               Each page gets its own iframe the first time it's opened and keeps it.
               Switching only shows one and hides the rest, so nothing reloads. */
            function purge() {                      // throw every page away (lock, panic, refresh)
                gen++; token++;
                for (const { el } of pages.values()) el.remove();
                pages.clear();
                current = null;
            }

            function wire(doc) {
                // keep navigation inside the shell
                doc.addEventListener("click", e => {
                    const a = e.target.closest && e.target.closest("a[href]");
                    if (!a || e.defaultPrevented || e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
                    const href = a.getAttribute("href");

                    if (/^(https?:)?\/\//i.test(href) || /^(mailto|tel):/i.test(href)) {
                        a.target = "_blank"; a.rel = "noopener noreferrer"; return;
                    }
                    if (href.startsWith("#") || href === "") return;

                    e.preventDefault();
                    const name = href.split("#")[0].split("?")[0].split("/").pop().replace(/\.html$/i, "") || CONFIG.home;
                    const next = name === CONFIG.home ? "" : `#/${name}`;
                    if ((location.hash || "") === next) return;
                    location.hash = next;
                });
                doc.addEventListener("keydown", hotkey);
            }

            function ensure(name) {                 // resolves to the page's iframe, creating it if needed
                const hit = pages.get(name);
                if (hit) return hit.ready;

                const el = document.createElement("iframe");
                el.className = "page-frame";
                el.title = "content";
                el.dataset.page = name;             // the page's own navbar reads this
                el.setAttribute("sandbox", SANDBOX);
                el.setAttribute("allow", ALLOW);
                el.setAttribute("allowfullscreen", "");
                el.referrerPolicy = "no-referrer";

                const g = gen;
                const ready = (async () => {
                    const html = await getPage(name);
                    if (g !== gen) throw new Error("stale");        // purged while fetching
                    await new Promise(done => {
                        el.addEventListener("load", () => {
                            const doc = el.contentDocument;
                            if (doc) { titles.set(name, doc.title || "silence"); wire(doc); }
                            apply();                                // accent, card size, motion
                            done();
                        }, { once: true });
                        el.srcdoc = html;
                        stage.append(el);
                    });
                    return el;
                })();

                const entry = { el, ready };
                pages.set(name, entry);
                ready.catch(() => { if (pages.get(name) === entry) pages.delete(name); el.remove(); });
                return ready;
            }

            const idle = window.requestIdleCallback || (f => setTimeout(f, 800));
            function preload() {
                if (!isUnlocked()) return;
                for (const n of CONFIG.preload || []) if (!pages.has(n)) ensure(n).catch(() => { });
            }

            function swap(name, el) {
                for (const f of stage.children) f.classList.toggle("on", f === el);
                if (name !== "disguise" && pages.has("disguise")) {   // just unlocked: drop the typing test
                    pages.get("disguise").el.remove();
                    pages.delete("disguise");
                }
                current = name;
                window.currentpage = name;
                pageTitle = titles.get(name) || "silence";
                apply();
                setState("ready");
                try { el.contentWindow.focus(); } catch { }
                if (name !== "disguise") idle(preload);
            }

            async function show(want) {
                const name = isUnlocked() ? want : "disguise";   // locked: every route is the typing test
                const my = ++token;
                if (!pages.has(name)) {
                    if (current) document.body.classList.add("busy");   // stay on the current page, thin bar only
                    else setState("loading");                           // very first load: full loader
                }
                try {
                    const el = await ensure(name);
                    if (my !== token) return;
                    swap(name, el);
                } catch {
                    if (my !== token) return;
                    $("#fail-url").textContent = failUrl;
                    setState("failed");
                } finally {
                    if (my === token) document.body.classList.remove("busy");
                }
            }

            addEventListener("hashchange", () => show(pageFromHash()));
            $("#retry").addEventListener("click", async () => { await resolveRef(true); show(pageFromHash()); });

            show(pageFromHash());
        })();
    </script>
</body>

</html>
